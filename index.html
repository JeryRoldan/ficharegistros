<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172f68"><title>Panel de fichas de personal</title><style>
:root{--navy:#172f68;--blue:#294d9b;--red:#ef3340;--bg:#f3f6fa;--ink:#1a2940;--muted:#66758a;--line:#dfe6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:25px 18px}.wrap{width:min(1100px,100%);margin:auto}.top h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}.top p{margin:7px 0 0;opacity:.78}.main{padding:18px}.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e1e7ef;padding:4px;border-radius:13px}.tab{border:0;background:transparent;padding:12px;border-radius:10px;font-weight:800;color:var(--muted);cursor:pointer}.tab.active{background:#fff;color:var(--navy);box-shadow:0 3px 10px #172f6814}.buttons{display:flex;gap:9px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--navy);color:#fff}.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat b{display:block;font-size:1.65rem}.stat span{color:var(--muted);font-size:.83rem}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.cards{display:grid;gap:12px;padding:12px}.card{border:1px solid var(--line);border-radius:13px;padding:15px}.card h3{margin:0;font-size:1rem}.meta{display:grid;gap:5px;color:var(--muted);font-size:.85rem;margin:9px 0 13px}.docs{display:flex;flex-wrap:wrap;gap:7px}.doc{color:var(--navy);background:#eef2fa;text-decoration:none;padding:7px 9px;border-radius:8px;font-size:.78rem;font-weight:700}.loading{opacity:.6;pointer-events:none}@media(min-width:720px){.toolbar{flex-direction:row;align-items:center;justify-content:space-between}.tabs{width:390px}.summary{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr);padding:16px}.main{padding:24px}}@media print{.top,.toolbar,.buttons{display:none}.main{padding:0}.card{break-inside:avoid}.panel{border:0}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="wrap"><h1>Panel de fichas de personal</h1><p>Registros privados, Excel y documentos PDF</p></div></header><main class="main wrap"><div class="toolbar"><div class="tabs"><button class="tab active" data-company="inre">INRE</button><button class="tab" data-company="informaperu">InformaPerú</button></div><div class="buttons"><button class="btn ghost" id="refresh">Actualizar</button><button class="btn primary" id="excel">Descargar Excel</button></div></div><section class="summary"><div class="stat"><b id="total">0</b><span>Registros</span></div><div class="stat"><b id="docs">0</b><span>Documentos PDF</span></div></section><section class="panel"><div class="cards" id="cards"><div class="empty">Cargando registros…</div></div></section></main><script>
let current='inre';const cards=document.querySelector('#cards'),labels={archivo_cv:'CV',archivo_dni:'DNI',archivo_certijoven:'CERTIJOVEN',archivo_recibo:'Recibo',archivo_estudios:'Estudios',archivo_trabajo:'Constancia'};const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const preview=location.hostname.endsWith('github.io');
async function load(){document.body.classList.add('loading');try{if(preview){document.querySelector('#total').textContent='0';document.querySelector('#docs').textContent='0';cards.innerHTML='<div class="empty"><b>Vista demostrativa</b><br>Los registros aparecerán aquí cuando se conecte el almacenamiento en línea.</div>';return}const r=await fetch('/api/registros?empresa='+current);if(!r.ok)throw Error('No se pudieron cargar los registros');const rows=await r.json();document.querySelector('#total').textContent=rows.length;document.querySelector('#docs').textContent=rows.reduce((n,r)=>n+r.documentos.length,0);cards.innerHTML=rows.length?rows.map(r=>`<article class="card"><h3>${esc(r.nombre)||'Sin nombre'}</h3><div class="meta"><span>DNI: ${esc(r.documento)}</span><span>${esc(r.correo)} · ${esc(r.celular)}</span><span>Registro: ${esc(r.fecha_registro)}</span></div><div class="docs">${r.documentos.map(d=>`<a class="doc" target="_blank" href="/api/documento?empresa=${current}&id=${encodeURIComponent(r.id)}&archivo=${encodeURIComponent(d.archivo)}">${labels[d.tipo]||'PDF'}</a>`).join('')}</div></article>`).join(''):'<div class="empty">Aún no hay fichas registradas para esta empresa.</div>'}catch(e){cards.innerHTML=`<div class="empty">${esc(e.message)}</div>`}finally{document.body.classList.remove('loading')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.company;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelector('#refresh').onclick=load;document.querySelector('#excel').onclick=()=>preview?alert('La descarga se habilitará al conectar el almacenamiento en línea.'):location.href='/api/excel?empresa='+current;load();
</script></body></html>
