<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172f68"><title>Panel de fichas de personal</title><style>
:root{--navy:#172f68;--blue:#294d9b;--bg:#f3f6fa;--ink:#1a2940;--muted:#66758a;--line:#dfe6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:25px 18px}.wrap{width:min(1100px,100%);margin:auto}.top h1{margin:0;font-size:clamp(1.5rem,5vw,2.25rem)}.top p{margin:7px 0 0;opacity:.78}.main{padding:18px}.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e1e7ef;padding:4px;border-radius:13px}.tab{border:0;background:transparent;padding:12px;border-radius:10px;font-weight:800;color:var(--muted);cursor:pointer}.tab.active{background:#fff;color:var(--navy);box-shadow:0 3px 10px #172f6814}.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--navy);color:#fff}.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat b{display:block;font-size:1.65rem}.stat span{color:var(--muted);font-size:.83rem}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.empty{grid-column:1/-1;padding:45px 20px;text-align:center;color:var(--muted)}.cards{display:grid;gap:12px;padding:12px}.card{border:1px solid var(--line);border-radius:13px;padding:15px}.card h3{margin:0;font-size:1rem}.meta{display:grid;gap:5px;color:var(--muted);font-size:.85rem;margin:9px 0 13px}.docs{display:flex;flex-wrap:wrap;gap:7px}.doc{border:0;cursor:pointer;color:var(--navy);background:#eef2fa;text-decoration:none;padding:7px 9px;border-radius:8px;font-size:.78rem;font-weight:700}.login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--navy),#315bad)}.login.hidden{display:none}.loginbox{width:min(100%,390px);background:#fff;border-radius:20px;padding:25px;box-shadow:0 20px 60px #0004}.loginbox h2{margin:0}.loginbox p{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:700}.field input{width:100%;min-height:48px;border:1px solid #bdc8d6;border-radius:11px;padding:11px;font:inherit}.error{color:#b42318;min-height:22px}.loading{opacity:.6;pointer-events:none}@media(min-width:720px){.toolbar{flex-direction:row;align-items:center;justify-content:space-between}.tabs{width:390px}.summary{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr);padding:16px}.main{padding:24px}}@media print{.top,.toolbar,.login{display:none}.main{padding:0}.card{break-inside:avoid}.panel{border:0}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><section class="login" id="login"><form class="loginbox" id="loginForm"><h2>Acceso administrativo</h2><p>Ingresa con el usuario creado en Supabase.</p><div class="field"><label for="email">Correo</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password"></div><p class="error" id="error"></p><button class="btn primary" style="width:100%" type="submit">Ingresar</button></form></section><header class="top"><div class="wrap"><h1>Panel de fichas de personal</h1><p>Registros privados, Excel y documentos PDF</p></div></header><main class="main wrap"><div class="toolbar"><div class="tabs"><button class="tab active" data-company="inre">INRE</button><button class="tab" data-company="informaperu">InformaPerú</button></div><div class="buttons"><button class="btn ghost" id="refresh">Actualizar</button><button class="btn ghost" id="print">Imprimir</button><button class="btn primary" id="excel">Descargar Excel</button><button class="btn ghost" id="logout">Salir</button></div></div><section class="summary"><div class="stat"><b id="total">0</b><span>Registros</span></div><div class="stat"><b id="docs">0</b><span>Documentos PDF</span></div></section><section class="panel"><div class="cards" id="cards"><div class="empty">Inicia sesión para consultar registros.</div></div></section></main><script>
const SUPABASE_URL='https://ytcumrcrzouosrfzpqsm.supabase.co',SUPABASE_KEY='sb_publishable_1KoRjIREB5oOBlNn0uYoLg_4TSCi3zr';let current='inre',rows=[],session=JSON.parse(localStorage.getItem('fichasSession')||'null');const cards=document.querySelector('#cards'),labels={archivo_cv:'CV',archivo_dni:'DNI',archivo_certijoven:'CERTIJOVEN',archivo_recibo:'Recibo',archivo_estudios:'Estudios',archivo_trabajo:'Constancia'};const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const headers=()=>({apikey:SUPABASE_KEY,Authorization:`Bearer ${session.access_token}`});
async function login(email,password){const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok)throw Error('Correo o contraseña incorrectos.');session=data;localStorage.setItem('fichasSession',JSON.stringify(session));document.querySelector('#login').classList.add('hidden');load()}
async function load(){if(!session)return;document.body.classList.add('loading');try{const r=await fetch(`${SUPABASE_URL}/rest/v1/fichas_personal?empresa=eq.${current}&select=*&order=fecha_registro.desc`,{headers:headers()});if(r.status===401){logout();throw Error('La sesión terminó.')}if(!r.ok)throw Error('No se pudieron cargar los registros.');rows=await r.json();document.querySelector('#total').textContent=rows.length;document.querySelector('#docs').textContent=rows.reduce((n,r)=>n+Object.keys(r.documentos||{}).length,0);cards.innerHTML=rows.length?rows.map(r=>`<article class="card"><h3>${esc(r.nombre)}</h3><div class="meta"><span>DNI: ${esc(r.documento)}</span><span>${esc(r.correo)} · ${esc(r.celular)}</span><span>Registro: ${new Date(r.fecha_registro).toLocaleString('es-PE')}</span></div><div class="docs">${Object.entries(r.documentos||{}).map(([tipo,ruta])=>`<button class="doc" data-path="${esc(ruta)}">${labels[tipo]||'PDF'}</button>`).join('')}</div></article>`).join(''):'<div class="empty">Aún no hay fichas registradas para esta empresa.</div>'}catch(e){cards.innerHTML=`<div class="empty">${esc(e.message)}</div>`}finally{document.body.classList.remove('loading')}}
async function openPdf(path){const r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/documentos-personal/${path}`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const d=await r.json();if(!r.ok)return alert('No se pudo abrir el PDF.');window.open(SUPABASE_URL+'/storage/v1'+d.signedURL,'_blank')}
function excel(){if(!rows.length)return alert('No hay registros para descargar.');const keys=['fecha_registro','empresa','nombre','documento','correo','celular'],quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"',lines=[keys.join(';'),...rows.map(r=>keys.map(k=>quote(r[k])).join(';'))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=`fichas-${current}.csv`;a.click();URL.revokeObjectURL(a.href)}
function logout(){session=null;localStorage.removeItem('fichasSession');document.querySelector('#login').classList.remove('hidden')}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';try{await login(e.target.email.value,e.target.password.value)}catch(x){error.textContent=x.message}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.company;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});cards.onclick=e=>{const b=e.target.closest('[data-path]');if(b)openPdf(b.dataset.path)};document.querySelector('#refresh').onclick=load;document.querySelector('#print').onclick=()=>window.print();document.querySelector('#excel').onclick=excel;document.querySelector('#logout').onclick=logout;if(session){document.querySelector('#login').classList.add('hidden');load()}
</script></body></html>
